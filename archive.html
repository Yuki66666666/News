<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新聞存檔 — News Archive</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: #f5f5f7; color: #1d1d1f; padding: 40px 16px 64px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .nav { font-size: 13px; margin-bottom: 20px; }
  .nav a { color: #0066cc; text-decoration: none; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .sub { font-size: 14px; color: #6e6e73; margin-bottom: 32px; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  li a {
    display: block; background: #fff; border-radius: 12px;
    padding: 14px 18px; font-size: 15px; font-weight: 500;
    color: #1d1d1f; text-decoration: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    transition: background 0.15s;
  }
  li a:hover { background: #e8f0fe; }
  li a::after { content: " →"; color: #0066cc; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="./">← 今日簡報</a></div>
  <h1>新聞存檔</h1>
  <p class="sub">News Archive — 每日完整簡報</p>
  <ul>
    <li><a href="./2026-05-12/">2026 年 5 月 12 日</a></li>
  </ul>
</div>
</body>
</html>
